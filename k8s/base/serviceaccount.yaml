apiVersion: v1
kind: ServiceAccount
metadata:
  name: trade-capture
  namespace: capture
automountServiceAccountToken: false   # the app never calls the Kubernetes API
# Cloud overlays add ONE annotation here that binds the account to a cloud identity:
#   AWS   eks.amazonaws.com/role-arn: <app_role_arn>
#   GCP   iam.gke.io/gcp-service-account: <app_service_account>
#   Azure azure.workload.identity/client-id: <app_client_id>
