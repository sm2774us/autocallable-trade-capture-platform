apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - externalsecret.yaml
  - endpoints.yaml
patches:
  - target:
      kind: ServiceAccount
      name: trade-capture
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/trade-capture-prod-app
  - target:
      kind: ConfigMap
      name: trade-capture
    patch: |-
      - op: add
        path: /data/KAFKA_SASL_MECHANISM
        value: AWS_MSK_IAM
      - op: add
        path: /data/KAFKA_SASL_JAAS
        value: software.amazon.msk.auth.iam.IAMLoginModule required;
