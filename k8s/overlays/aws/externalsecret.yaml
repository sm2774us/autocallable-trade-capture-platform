# External Secrets Operator copies the RDS-managed password out of AWS Secrets Manager into a
# Kubernetes Secret. Nothing secret is in Git, and rotation propagates within the refresh interval.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trade-capture-db
  namespace: capture
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: trade-capture-db
  data:
    - secretKey: password
      remoteRef:
        key: rds!db-00000000-0000-0000-0000-000000000000
        property: password
