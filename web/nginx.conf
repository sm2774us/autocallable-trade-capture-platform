# Static single-page app + same-origin reverse proxy to the Spring service.
# BACKEND is resolved by Docker/K8s DNS; the service name is "capture".
upstream capture_backend {
  server capture:8080;
  keepalive 16;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Hashed bundles never change: cache for a year. index.html must always be revalidated.
  location ~* \.(js|css|woff2?|svg|png|ico)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-store"; }

  location /api/ {
    proxy_pass http://capture_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /actuator/health {
    proxy_pass http://capture_backend;
  }

  # WebSocket feeds: upgrade headers and a read timeout longer than the 1 s heartbeat.
  location /ws/ {
    proxy_pass http://capture_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
